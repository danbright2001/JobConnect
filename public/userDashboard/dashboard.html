<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobs Dashboard - Explore and Apply for Jobs | JobConnect</title>
    <meta name="description" content="Explore available jobs on JobConnect. Find opportunities that match your skills and start earning instantly. Apply now!">
    <meta name="keywords" content="jobs dashboard, available jobs, apply for jobs, JobConnect, online jobs, earn money">
    <meta name="author" content="JobConnect">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar - Removed for cleaner jobs-focused layout -->
        
        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Top Navigation -->
            <header class="bg-white shadow-sm z-40">
                <div class="flex items-center justify-between h-16 px-4">
                    <!-- Logo/Brand -->
                    <div class="flex items-center">
                        <i class="fas fa-briefcase text-indigo-600 text-xl mr-2"></i>
                        <span class="text-xl font-bold text-indigo-600">JobConnect</span>
                    </div>
                    
                    <!-- User profile with name -->
                    <div class="ml-4 flex items-center">
                        <div class="relative">
                            <button id="userMenuButton" class="flex items-center text-sm rounded-full focus:outline-none">
                                <span class="sr-only">Open user menu</span>
                                <span id="welcomeMessage" class="mr-2 font-medium text-green-700 text-xl"></span>
                                <img class="h-8 w-8 rounded-full" src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?ixlib=rb-1.2.1&auto=format&fit=facearea&facepad=2&w=256&h=256&q=80" alt="">
                            </button>
                            <!-- Dropdown menu -->
                            <div id="userDropdown" class="hidden origin-top-right absolute right-0 mt-2 w-48 rounded-md shadow-lg py-1 bg-white ring-1 ring-black ring-opacity-5 focus:outline-none">
                                <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Profile</a>
                                <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Settings</a>
                                <a href="#" id="logoutButton" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Sign out</a>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Main content area - Jobs Display -->
            <main class="flex-1 overflow-y-auto p-4 bg-gray-50">
                <div class="max-w-7xl mx-auto px-2 sm:px-4 lg:px-6">
                    <!-- Filter/Search Bar -->
                    <div class="mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <h1 class="text-2xl font-bold text-gray-800">Available Jobs</h1>
                        <div class="w-full sm:w-64">
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fas fa-search text-gray-400"></i>
                                </div>
                                <input type="text" class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md bg-white placeholder-gray-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500" placeholder="Search jobs...">
                            </div>
                        </div>
                    </div>
                    
                    <!-- Jobs Display Container -->
                    <div id="jobsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                        <!-- Dynamic job listings will be inserted here -->
                        <!-- Structure will be handled by your JavaScript -->
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script type="module" src="dashboard.js"></script>
</body>
</html>
