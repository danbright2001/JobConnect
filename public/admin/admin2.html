
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Post Jobs</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 ">

  <nav class="container">
    <div>
      <div class="">AdminDashboard
        h1
      </div>
    </div>
  </nav>
  <div class="container mx-auto px-4 py-8">
    <div class="mb-8 text-center">
      <h1 class="text-2xl md:text-3xl font-bold text-gray-800">Job Posting Dashboard</h1>
      <p class="text-gray-600 mt-2">Add new job opportunities</p>
    </div>

    <!-- Total Users Section -->
    <div class="bg-white rounded-lg shadow-md p-4 md:p-6 max-w-2xl mx-auto mb-8">
      <h2 class="text-xl font-bold text-gray-800 mb-4">Total Users</h2>
      <p id="totalUsers" class="text-gray-600">Loading...</p>
    </div>



    <!-- users By email and Name -->
    <h2>The users of the Platform</h2>
    
    <div id="usersContainer" class="grid  gap-4"></div>

    <!-- Total Jobs Section -->
    <div class="bg-white rounded-lg shadow-md p-4 md:p-6 max-w-2xl mx-auto mb-8">
      <h2 class="text-xl font-bold text-gray-800 mb-4">Total Jobs</h2>
      <p id="totalJobs" class="text-gray-600">Loading...</p>
    </div>

    <!-- Job Posting Form -->
    <div class="bg-white rounded-lg shadow-md p-4 md:p-6 max-w-2xl mx-auto">
      <form id="jobForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Job Title</label>
          <input type="text" id="jobTitle" required
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Job Description</label>
          <textarea id="jobDescription" rows="4" required
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Stipend ($)</label>
          <input type="number" id="jobStipend" required
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <button type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md transition duration-200">
          Post Job
        </button>
      </form>
      <div id="statusMessage" class="mt-4 hidden"></div>
    </div>
  </div>

  <script type="module" src="adminFunctions.js"></script>
</body>
</html>
