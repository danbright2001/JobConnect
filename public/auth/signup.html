<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Join JobConnect and Start Earning</title>
  <meta name="description" content="Sign up for JobConnect and start earning money instantly with easy jobs that require no skills. Create your account today!">
  <meta name="keywords" content="sign up, create account, JobConnect, earn money, online jobs, easy jobs">
  <meta name="author" content="JobConnect">
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="bg-gray-50">
  <div class="flex items-center justify-center min-h-screen">
    <div class="bg-white shadow-lg rounded-lg p-6 max-w-md w-full">
      <h1 class="text-2xl font-bold text-gray-800 mb-4">Sign Up</h1>
      <form id="signUpForm" class="space-y-4">
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
          <input type="text" id="name" name="name" required
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
          <input type="email" id="email" name="email" required
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
          <input type="password" id="password" name="password" required
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label for="cpassword" class="block text-sm font-medium text-gray-700">Confirm Password</label>
          <input type="password" id="cpassword" name="cpassword" required
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <button type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md transition duration-200">
          Sign Up
        </button>
        <div>
          <p class="text-sm text-gray-600">Already have an account? <a href="signin.html" class="text-blue-600 font-semibold hover:text-blue-800">Sign In</a></p>
        </div>
      </form>
    </div>
  </div>
  <script type="module" src="signup.js"></script>
</body>
</html>
